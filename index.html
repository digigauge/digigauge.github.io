<!DOCTYPE html><!DOCTYPE html>
<html>
    <head>
        <title>Digimon Memory Gauge Online</title>
        <meta charset="utf-8">  
        <meta name="viewport" content="width=device-width, initial-scale=1.0" zoom="1.0">
        <!--for making the website more responsive-->
        <meta http-equiv="X-UA-compatible" content="ie=">
        <!--for Favicon-->
        <link rel="shortcut icon" type="image/png" href="https://https://world.digimoncard.com/favicon.ico">
        <!--for CSS-->
        <link rel="stylesheet" type="text/css" href="styles.css">
        <!--link rel="stylesheet" href="https://www.w3schools.com/lib/w3.css"/ -->
    </head>
    <body>
        <div class="scroll">
            <div class="wrapper">
                <div class="digigauge">
                    <div class="player1"></div>
                    <div class="gauge"></div>
                    <div class="player2"></div>
                </div>
            </div>
            <div class="wrapper">
                <div class="gauge-bg">
                    <div class="counters" id="list">
                        <div class="item" style="--i: -10">X</div>
                        <div class="item" style="--i: -9">9</div>
                        <div class="item" style="--i: -8">8</div>
                        <div class="item" style="--i: -7">7</div>
                        <div class="item" style="--i: -6">6</div>
                        <div class="item" style="--i: -5">5</div>
                        <div class="item" style="--i: -4">4</div>
                        <div class="item" style="--i: -3">3</div>
                        <div class="item" style="--i: -2">2</div>
                        <div class="item" style="--i: -1">1</div>
                        <div class="item" style="--i: 0">0</div>
                        <div class="item" style="--i: 1">1</div>
                        <div class="item" style="--i: 2">2</div>
                        <div class="item" style="--i: 3">3</div>
                        <div class="item" style="--i: 4">4</div>
                        <div class="item" style="--i: 5">5</div>
                        <div class="item" style="--i: 6">6</div>
                        <div class="item" style="--i: 7">7</div>
                        <div class="item" style="--i: 8">8</div>
                        <div class="item" style="--i: 9">9</div>
                        <div class="item" style="--i: 10">X</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
